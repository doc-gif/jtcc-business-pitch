name: Build and deploy versioned site to GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SITE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v5
      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH (for example v1.0.0)." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Build latest site
        if: github.ref_type == 'branch'
        run: pnpm build --mode github-pages --base /jtcc-business-pitch/
      - name: Build tagged site
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm build --mode github-pages --base "/jtcc-business-pitch/versions/${RELEASE_TAG}/"
      - uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist
          retention-days: 1

  persist:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/checkout@v6
        with:
          ref: pages-store
          path: pages-store
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: site-build
          path: dist
      - name: Store build without replacing existing versions
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" && ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unsafe release tag; refusing to create a site path." >&2
            exit 1
          fi
          git -C pages-store config user.name "github-actions[bot]"
          git -C pages-store config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in {1..8}; do
            git -C pages-store fetch origin pages-store
            git -C pages-store reset --hard FETCH_HEAD
            mkdir -p pages-store/latest pages-store/versions
            if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
              current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
              if [[ "$current_main" != "$GITHUB_SHA" ]]; then
                echo "Skipping stale main build $GITHUB_SHA; main is now $current_main."
                exit 0
              fi
              rm -rf pages-store/latest
              mkdir -p pages-store/latest
              cp -a dist/. pages-store/latest/
              version_label="latest"
            else
              version_dir="pages-store/versions/$GITHUB_REF_NAME"
              if [[ -e "$version_dir/index.html" ]]; then
                echo "Version $GITHUB_REF_NAME already exists; refusing to overwrite it." >&2
                exit 1
              fi
              mkdir -p "$version_dir"
              cp -a dist/. "$version_dir/"
              version_label="$GITHUB_REF_NAME"
            fi
            git -C pages-store add latest versions
            if git -C pages-store diff --cached --quiet; then
              echo "No archive changes to save."
              exit 0
            fi
            git -C pages-store -c core.autocrlf=false commit -m "Store $version_label site build"
            if git -C pages-store push origin HEAD:refs/heads/pages-store; then
              exit 0
            fi
            echo "Archive branch changed during save; retrying from its newest state."
            sleep 2
          done
          echo "Could not save the build after several retries." >&2
          exit 1

  deploy:
    needs: persist
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pages-store
          path: pages-store
      - name: Assemble complete site from stored builds
        run: |
          mkdir -p public/versions
          cp -a pages-store/latest/. public/
          if [ -d pages-store/versions ]; then
            cp -a pages-store/versions/. public/versions/
          fi
          node -e 'const fs=require("node:fs"); const path=require("node:path"); const versions=fs.existsSync("pages-store/versions")?fs.readdirSync("pages-store/versions").filter(name=>/^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/.test(name)&&fs.existsSync(path.join("pages-store/versions",name,"index.html"))).sort((a,b)=>b.localeCompare(a,undefined,{numeric:true})):[]; fs.writeFileSync("public/versions.json",JSON.stringify(versions,null,2)+"\n");'
      - name: Select unique Pages build version
        id: pages-version
        run: echo "value=$(git -C pages-store rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy complete site to GitHub Pages
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_BUILD_VERSION: ${{ steps.pages-version.outputs.value }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: context.runId,
            });
            const artifacts = data.artifacts.filter((artifact) => artifact.name === "github-pages" && !artifact.expired);
            if (artifacts.length !== 1) {
              throw new Error(`Expected one github-pages artifact, found ${artifacts.length}.`);
            }

            const oidcToken = await core.getIDToken();
            const created = await github.request("POST /repos/{owner}/{repo}/pages/deployments", {
              owner,
              repo,
              artifact_id: artifacts[0].id,
              pages_build_version: process.env.PAGES_BUILD_VERSION,
              oidc_token: oidcToken,
            });
            core.setOutput("page_url", created.data.page_url);
            core.info(`Created Pages deployment ${created.data.id} from archive commit ${process.env.PAGES_BUILD_VERSION}.`);

            const deadline = Date.now() + 600_000;
            while (Date.now() < deadline) {
              const status = await github.request("GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}", {
                owner,
                repo,
                deploymentId: created.data.id,
              });
              if (status.data.status === "built") {
                core.info("GitHub Pages deployment completed.");
                break;
              }
              if (["errored", "cancelled"].includes(status.data.status)) {
                throw new Error(`GitHub Pages deployment ended with status ${status.data.status}.`);
              }
              await new Promise((resolve) => setTimeout(resolve, 5_000));
            }
            if (Date.now() >= deadline) {
              throw new Error("Timed out waiting for GitHub Pages deployment status.");
            }
